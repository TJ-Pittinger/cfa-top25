name: Download team logos

on:
  push:
    paths:
      - "teams.js"
      - ".github/workflows/logos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download logos
        run: python tools/download_logos.py
      - name: Save logos to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos
          git diff --cached --quiet || git commit -m "Update team logos"
          git push
