name: Update scores from ESPN

on:
  schedule:
    # Sundays at 12:00, 12:30, 1:00 and 3:00 AM Eastern. GitHub only takes UTC times,
    # so this covers both daylight time (Sep-Oct) and standard time (Nov-Jan).
    # A few extra runs result; each one just refreshes the same scores.
    - cron: "0 4 * * 0"   # 12:00 AM EDT
    - cron: "30 4 * * 0"  # 12:30 AM EDT
    - cron: "0 5 * * 0"   #  1:00 AM EDT / 12:00 AM EST
    - cron: "30 5 * * 0"  # 12:30 AM EST
    - cron: "0 6 * * 0"   #  1:00 AM EST
    - cron: "0 7 * * 0"   #  3:00 AM EDT
    - cron: "0 8 * * 0"   #  3:00 AM EST
  workflow_dispatch:
    inputs:
      week:
        description: "Poll week (leave blank for the next one)"
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load scores and records
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python tools/update_scores.py --week "${{ github.event.inputs.week }}"
          else
            python tools/update_scores.py
          fi
